version: 2

models:
  - name: stg_311_requests
    columns:
      - name: request_id
        tests:
          - unique
          - not_null
      - name: borough
        tests:
          - accepted_values:
              values: ['MANHATTAN', 'BROOKLYN', 'QUEENS', 'BRONX', 'STATEN ISLAND','Unspecified']

  - name: stg_sla_targets
    description: "Official 311 SLA per (complaint_type, descriptor), in hours."
    columns:
      - name: complaint_type
        tests:
          - not_null
      - name: sla_hours
        tests:
          - not_null